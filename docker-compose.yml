services:
  postgres:
    image: postgres:16
    container_name: screenplant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: screenplant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - screenplant_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d screenplant"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  screenplant_postgres_data:
